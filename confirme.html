<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adresse confirmée · Constancy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07030c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,500&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* V310.36 (Thomas, 23/11 20h35) : page d'arrivée après « Confirmer mon adresse » dans l'e-mail.
   Le lien de l'e-mail s'ouvre dans Safari, pas dans TikTok ou Instagram où le joueur jouait : on lui dit que son jeu est débloqué et on le renvoie là où il jouait. */
:root{--bg:#07030c;--ink:#f2f0ec;--pink:#ff3fa4;--mute:rgba(242,240,236,.66)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#3a1446 0%,#160a22 55%,#07030c 100%);color:var(--ink);font:500 16px/1.45 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 18px calc(28px + env(safe-area-inset-bottom))}
main{width:100%;max-width:420px;text-align:center}
.ok{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:rgba(94,240,160,.12);border:1.5px solid #5ef0a0;box-shadow:0 0 28px rgba(94,240,160,.35)}
.ok svg{width:30px;height:30px}
.k{font:800 11px/1 Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--pink);margin-bottom:12px}
h1{font:500 40px/1.05 'EB Garamond',Georgia,serif;margin-bottom:12px}
h1 em{font-style:italic;color:#ffb3dc}
p{color:var(--mute);margin-bottom:22px}
p b{color:var(--ink)}
.go{display:block;width:100%;padding:16px 18px;border-radius:16px;border:0;margin:0 0 10px;font:800 16px/1 Inter,sans-serif;color:#fff;text-decoration:none;background:linear-gradient(180deg,#ff6fb8,#e0307f);box-shadow:0 10px 26px rgba(255,45,149,.35)}
.go.alt{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-weight:700}
.go.main{outline:2px solid #fff;outline-offset:2px}
small{display:block;margin-top:14px;color:rgba(242,240,236,.45);font-size:12.5px}
</style>
</head>
<body>
<main>
  <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#5ef0a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
  <div class="k">Constancy</div>
  <h1>Adresse <em>confirmée.</em></h1>
  <p id="msg">Ton jeu s'est <b>débloqué tout seul</b>. Retourne là où tu jouais, ta partie t'attend.</p>
  <a class="go" id="tt" href="snssdk1233://">Retourner sur TikTok</a>
  <a class="go alt" id="ig" href="instagram://app">Retourner sur Instagram</a>
  <a class="go alt" id="yt" href="youtube://">Retourner sur YouTube</a>
  <a class="go alt" id="web" href="/?confirme=1">Je jouais ici, sur ce navigateur</a>
  <small>Si l'appli ne s'ouvre pas, ouvre-la toi-même : le jeu se remet en route au retour.</small>
</main>
<script>
// La source du joueur (?src=tt, ig, yt, fb…) peut être ajoutée au lien de redirection : le bon bouton passe alors en premier.
(function () { try {
  var q = new URLSearchParams(location.search), s = (q.get("src") || q.get("s") || "").toLowerCase(), map = { tt: "tt", tiktok: "tt", ig: "ig", instagram: "ig", yt: "yt", youtube: "yt", web: "web", direct: "web" }, k = map[s];
  if (k) { var b = document.getElementById(k), m = document.querySelector("main"), first = document.getElementById("tt"); b.classList.remove("alt"); if (b !== first) { first.classList.add("alt"); m.insertBefore(b, first); } }
  // statistiques : une seule ligne, comme le jeu (GoatCounter), jamais pour les tests
  if (localStorage.getItem("skipgc") !== "t" && localStorage.getItem("cst-testacc") !== "1") { var sc = document.createElement("script"); sc.async = true; sc.src = "https://gc.zgo.at/count.js"; sc.dataset.goatcounter = "https://constancy.goatcounter.com/count"; sc.onload = function () { try { window.goatcounter.count({ path: "evt-confirmation-page" + (k ? "-" + k : ""), title: "confirmation-page", event: true }); } catch (e) {} }; document.head.appendChild(sc); }
  ["tt", "ig", "yt", "web"].forEach(function (id) { document.getElementById(id).addEventListener("click", function () { try { window.goatcounter && window.goatcounter.count({ path: "evt-confirmation-retour-" + id, title: "confirmation-retour", event: true }); } catch (e) {} }); });
} catch (e) {} })();
</script>
</body>
</html>
