<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Constancy : la ville où ta constance fait le score. Joue gratuitement sur ton téléphone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Constancy">
<meta property="og:title" content="Constancy"><meta property="og:description" content="La ville où ta constance fait le score."><meta property="og:image" content="icons/og-1200x630.png">
<style>html,body{margin:0;background:#000}</style>
</head><body>
<title>Constancy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;600;800&display=swap">
<style>
/* Layout : jeu plein écran. Ville 3D en fond, HUD façon jeu en monde ouvert (argent et étoiles en haut à droite, minimap et jauges en bas à gauche, boutons d'action en bas à droite), écrans de menu centrés par-dessus. */
:root{
  --ink:#050505;
  --glass:rgba(8,8,12,.72);
  --fg:#f6f3ee;
  --muted:#a9a6b3;
  --cash:#7ee08a;
  --physique:#d6d6de;
  --mental:#3d8bff;
  --finance:#ff9f1a;
  --env:#3fd16b;
  --business:#9b5cff;
  --gold:#ff2d55;
  --danger:#ff2d55;
  --red-grad:linear-gradient(135deg,#ff2d55,#ff7a45);
  --font-display:"Anton","Impact","Arial Narrow",sans-serif;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--fg);overflow:hidden}
body{font-family:var(--font-ui);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#glare,#adapt{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s linear}
#adapt{background:#000}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.tr{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.money{font-family:var(--font-display);font-size:clamp(28px,7vw,40px);line-height:1;color:var(--fg);letter-spacing:.01em;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.9);font-variant-numeric:tabular-nums}
.money .d{color:var(--cash)}
.delta{font-family:var(--font-display);font-size:22px;color:var(--cash);text-shadow:0 2px 0 #000;height:24px;opacity:0;transition:opacity .3s}
.delta.on{opacity:1}
.clock{font-family:var(--font-display);font-size:17px;letter-spacing:.06em;text-shadow:0 2px 0 #000}
.mult{font-family:var(--font-display);font-size:14px;letter-spacing:.06em;color:var(--gold);text-shadow:0 2px 0 #000;pointer-events:auto;cursor:pointer}
.mult::after{content:" ⓘ";font-family:var(--font-ui);font-size:12px}
.stars{display:flex;gap:3px;margin-top:2px}
.stars svg{width:22px;height:22px}
.goals{margin-top:8px;background:var(--glass);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.5;min-width:150px;text-align:left}
.goals b{display:block;font-family:var(--font-display);font-weight:400;font-size:13px;letter-spacing:.08em;color:var(--gold);margin-bottom:2px}
.goals .g{display:flex;justify-content:space-between;gap:10px;align-items:center}
.goals .g i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.goals .g.ok{color:var(--cash)}

.tl{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:min(300px,52vw)}
.tl .row{display:flex;gap:6px}
.chip{font:700 12px var(--font-ui,Inter),sans-serif;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 12px;cursor:pointer}.chip.on{background:#ff2d55;border-color:#ff2d55}
.lvl{position:relative;align-self:flex-end;margin-top:2px;font-family:var(--font-display);font-size:13px;letter-spacing:.12em;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:3px 8px 5px;overflow:hidden;text-shadow:0 1px 2px #000}.lvl i{position:absolute;left:0;bottom:0;height:3px;background:var(--red-grad,#ff2d55)}
.menu-btn{pointer-events:auto;font-family:var(--font-display);font-size:15px;letter-spacing:.1em;color:var(--fg);background:var(--glass);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:7px 12px;cursor:pointer}
.help{background:rgba(0,0,0,.82);border-left:3px solid var(--gold);padding:9px 12px;font-size:13px;line-height:1.45;border-radius:0 6px 6px 0;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s}
.help.on{opacity:1;transform:none}
#scopeV{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .4s;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 34vmin,rgba(0,0,0,.92) 35vmin,#000 60vmin)}#scopeV.on{opacity:1}
#notes{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);width:min(92vw,440px);z-index:30;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.note-bar{pointer-events:auto;font:500 13px/1.4 Inter,sans-serif;color:#fff;padding:10px 14px 10px 12px;border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translateY(-140%);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .45s;display:flex;gap:10px;align-items:flex-start;touch-action:pan-y}
.note-bar.on{transform:none;opacity:1}
.note-bar .ic{font:700 10px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 6px;border-radius:6px;flex:none;margin-top:1px}
.note-bar.gold{background:linear-gradient(135deg,rgba(40,30,8,.92),rgba(24,20,10,.92));border:1px solid rgba(246,201,69,.55)}
.note-bar.gold .ic{background:#f6c945;color:#1a1406}
.note-bar.blue{background:linear-gradient(135deg,rgba(8,26,48,.92),rgba(10,18,32,.92));border:1px solid rgba(52,224,255,.5)}
.note-bar.blue .ic{background:#34e0ff;color:#04202a}

.mission{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));text-align:center;max-width:44vw}
.mission .k{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 0 #000}
.mission .t{font-family:var(--font-display);font-size:26px;line-height:1.05;text-shadow:0 2px 0 #000}
.mission .s{font-size:12px;font-weight:600;color:#e6e2ea;text-shadow:0 1px 2px #000}
.catch{width:130px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin:6px auto 0;overflow:hidden}
.catch i{display:block;height:100%;width:0;background:var(--env)}

.sub{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(235px + env(safe-area-inset-bottom,0px));width:min(560px,86vw);text-align:center;font-size:16px;font-weight:600;line-height:1.35;text-shadow:0 2px 3px #000,0 0 8px #000}
.sub b{font-weight:800}

.bl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px}
#minimap{pointer-events:auto;cursor:pointer;width:clamp(120px,30vw,160px);height:clamp(120px,30vw,160px);border-radius:50%;border:3px solid rgba(0,0,0,.85);box-shadow:0 0 0 2px rgba(255,255,255,.25),0 6px 18px rgba(0,0,0,.5);background:#1b1a20;display:block}
#energy{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(200px + env(safe-area-inset-bottom,0px));width:250px;pointer-events:none}
#energy .gauge{height:10px!important}
#energy span{display:block;text-align:center;font-size:9px;font-weight:800;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px #000;margin-bottom:3px}
#energy .gauge{height:7px;background:rgba(0,0,0,.5)}
#energy .gauge i{background:linear-gradient(90deg,#14964a,#6ff59a)}
#energy.low .gauge i{background:var(--red-grad)}
#joy.sprint i{background:linear-gradient(180deg,#fff,#c9b98a)}
#joy.max i{background:var(--red-grad);box-shadow:0 0 22px rgba(255,45,85,.8)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;width:clamp(190px,50vw,240px);background:var(--glass);border-radius:8px;padding:8px}
.st{display:flex;flex-direction:column;gap:3px;min-width:0}
.st span{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#e9e6ee}
.st span b{font-weight:800;color:#fff}
.gauge{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;border-radius:4px;transition:width .4s}
.main{margin-top:6px;background:var(--glass);border-radius:8px;padding:8px 10px;min-width:170px;text-align:left}
.main .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--danger)}
.main .t{font-family:var(--font-display);font-size:17px;letter-spacing:.03em;margin:2px 0 5px}
.main .gauge{height:10px}
.main .gauge i{background:var(--red-grad)}

/* ---------- Commandes ---------- */
#actions{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.act{pointer-events:auto;min-width:64px;height:58px;padding:0 16px;border-radius:29px;border:1px solid rgba(255,255,255,.22);background:var(--glass);color:var(--fg);font-family:var(--font-display);font-size:17px;letter-spacing:.08em;cursor:pointer;touch-action:none}
.act.brake{width:78px;height:78px;border-radius:50%;font-size:16px}
.act.brake.on{background:var(--danger)}
.act.turbo{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff2d55,#ff8a00);color:#fff;border:0;font-weight:700}.act.turbo.on{box-shadow:0 0 22px #ff8a00}.act.turbo i{position:absolute;left:0;bottom:0;height:4px;background:#fff;width:100%}.act.joker{background:var(--red-grad);color:#fff;border:0}
#joyHint{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:110px;height:110px;margin-left:-55px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);text-shadow:0 1px 2px #000}
@media (pointer:fine){#joyHint{display:none!important}}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);pointer-events:none}
#joy i{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(0,0,0,.5)}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(280px + env(safe-area-inset-bottom,0px));font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;opacity:.85}

/* ---------- Écrans ---------- */
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(5,5,5,.5),rgba(5,5,5,.88));overflow-y:auto;pointer-events:auto;touch-action:pan-y}
#screen.clear{background:rgba(5,5,5,.6)}
.ptr{position:fixed;z-index:60;font-size:54px;line-height:1;color:#fff;text-shadow:0 0 18px rgba(255,45,85,.9),0 2px 0 #000;pointer-events:none;animation:ptrB 0.9s ease-in-out infinite alternate}
.ptr.tr{top:calc(4px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px))}
.ptr.br{bottom:calc(6px + env(safe-area-inset-bottom,0px));right:calc(22px + env(safe-area-inset-right,0px))}
.ptr.bc{bottom:calc(6px + env(safe-area-inset-bottom,0px));left:50%;margin-left:-20px}
.ptr.tr{animation-name:ptrT}
@keyframes ptrB{from{transform:translateY(-14px)}to{transform:translateY(4px)}}
@keyframes ptrT{from{transform:translate(-4px,16px)}to{transform:translate(4px,0)}}
.steps{text-align:left;margin:10px 0 4px;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:9px 0 9px 42px;font-size:15px;line-height:1.35;border-bottom:1px solid rgba(255,255,255,.08)}
.steps li::before{content:counter(st);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--red-grad);color:#fff;font-family:var(--font-display);font-size:16px;display:flex;align-items:center;justify-content:center}
.kbd{display:inline-block;min-width:22px;padding:1px 7px;border-radius:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-weight:700}
.linkbox{width:100%;margin-top:8px;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--fg);font:600 15px var(--font-ui);text-align:center;-webkit-user-select:all;user-select:all}
.inapp{display:flex;gap:10px;align-items:center;text-align:left;margin:0 0 12px;padding:10px 12px;border-radius:14px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.45);font-size:13.5px;line-height:1.35;cursor:pointer}
.inapp b{color:#fff}
.inapp .go{margin-left:auto;font-family:var(--font-display);font-size:15px;letter-spacing:.04em;white-space:nowrap}
.panel{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;margin:auto 0}
.logo{font-family:'EB Garamond',Garamond,serif;font-weight:400;font-size:clamp(48px,15vw,108px);line-height:1;letter-spacing:.005em;color:#f2f0ec;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.tag{font-family:var(--font-display);font-size:clamp(20px,5.5vw,28px);letter-spacing:.04em;line-height:1.1}
.tag em{font-style:normal;color:var(--gold)}
.lead{font-size:15px;line-height:1.55;color:#dcd8e2;margin:0}
h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1;letter-spacing:.02em;text-wrap:balance}
.kicker{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.btn{font-family:var(--font-display);font-size:20px;letter-spacing:.08em;padding:15px 18px;border:0;border-radius:6px;background:#fff;color:var(--ink);cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.alt{background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.25)}
.btn.pink{background:#ff3fa4;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.choice:focus-visible,.menu-btn:focus-visible,.act:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:rgba(20,18,26,.85);color:var(--fg);cursor:pointer;font-family:var(--font-ui);min-width:0}
.choice b{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.03em;line-height:1.05}
.choice span{font-size:12px;line-height:1.4;color:var(--muted)}
.choice.sel{border-color:#fff;box-shadow:inset 0 0 0 1px #fff}
.choice.locked{opacity:.38;cursor:default}
.choice .lock{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--danger)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:58px;height:58px;border-radius:10px;border:2px solid rgba(255,255,255,.18);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:4px;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px #fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{font-family:var(--font-display);font-size:20px;letter-spacing:.06em;padding:14px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(20,18,26,.85);color:var(--fg);cursor:pointer}
.seg button.sel{background:#fff;color:var(--ink)}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:rgba(14,13,18,.92);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.statline{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.statline span:nth-child(even){font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45;color:#dcd8e2}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.avatar{display:flex;gap:14px;align-items:center}
.avatar svg{width:92px;height:140px;flex:0 0 auto}
.shop-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(14,13,18,.9)}
.swatch{width:34px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.3)}
.shop-item b{font-family:var(--font-display);font-weight:400;font-size:18px;letter-spacing:.03em}
.shop-item small{display:block;color:var(--muted);font-size:12px}
.shop-item button{font-family:var(--font-display);font-size:15px;letter-spacing:.06em;padding:9px 12px;border-radius:6px;border:0;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.shop-item button:disabled{background:#3a3842;color:var(--muted);cursor:default}
.gym{display:grid;grid-template-columns:1fr 70px;gap:14px;align-items:stretch}
.gym-art{height:180px;border-radius:8px;background:radial-gradient(circle at 50% 120%,#3a3a44,#0e0d12 70%);position:relative;overflow:hidden}
.bar-v{border-radius:8px;background:#1a1920;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.bar-v i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#9a9aa6,#ffffff)}
.push{font-family:var(--font-display);font-size:30px;letter-spacing:.1em;padding:22px;border-radius:10px;border:0;background:var(--physique);color:var(--ink);cursor:pointer;touch-action:manipulation}
.push:active{transform:scale(.97)}
.reps{font-family:var(--font-display);font-size:40px;line-height:1}
.reps small{font-size:18px;color:var(--muted)}
.q{font-size:17px;font-weight:600;line-height:1.4}
.opt{font-family:var(--font-ui);font-size:15px;font-weight:600;text-align:left;padding:13px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(20,18,26,.9);color:var(--fg);cursor:pointer;line-height:1.35}
.opt.good{border-color:var(--cash);background:rgba(126,224,138,.14)}
.opt.bad{border-color:var(--danger);background:rgba(255,63,108,.12)}
@media (orientation:landscape) and (max-height:500px){
  .sub{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  #minimap{width:100px;height:100px}.stats{width:170px}
  .goals{display:none}
}

/* ---------- HUD premium (v20) : minimal, verre, relief ---------- */
:root{--glass2:linear-gradient(180deg,rgba(38,38,46,.62),rgba(10,10,14,.72));--edge:rgba(255,255,255,.14);--hi:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.4);--drop:0 10px 28px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35)}
.menu-btn.ico{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--edge);box-shadow:var(--hi),var(--drop);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#f2f0ec;transition:transform .15s,background .2s}
.menu-btn.ico svg{width:22px;height:22px}
.menu-btn.ico:active{transform:scale(.93)}

<script>
(() => {
"use strict";
/* Lien vers le formulaire Kit de pré-inscription. Vide = bouton « bientôt ». */
const SIGNUP_URL = "";
const SAVE_KEY = "constancy-beta-v1";
const IDEAS_URL = ""; // lien de la boîte à idées (formulaire, Instagram…) : à fournir par Thomas

/* ============ Plan de la ville ============ */
const ROAD = 16, BLOCK = 40, STEP = ROAD + BLOCK, NB = 14, WALK = 4;
const HALF = (NB * BLOCK + (NB + 1) * ROAD) / 2;           // 400
const SHORE = HALF + 40;                                     // bord de l'eau
// rivage organique : carré aux angles très arrondis + ondulations, la plage descend en pente douce sous l'eau
const shoreE = (x, z) => Math.pow(Math.pow(Math.abs(x), 6) + Math.pow(Math.abs(z), 6), 1 / 6);
const shoreEdge = (x, z) => { const a = Math.atan2(z, x); return SHORE + 9 * Math.sin(3 * a + 1) + 6 * Math.sin(7 * a + 2) + 3.5 * Math.sin(13 * a + 0.5) + 2 * Math.sin(29 * a); };
const beachH = (x, z) => { const e = shoreE(x, z), ed = shoreEdge(x, z), t = Math.min(1, Math.max(0, (e - (ed - 18)) / 40)); let h = -0.05 - 2.6 * t * t * (3 - 2 * t); if (z > RZ0 + 0.5 && z < RZ1 - 0.5) h = -2.6; return h; };
// rivière façon Miami : une rangée de pâtés devient un canal qui traverse la ville d'une mer à l'autre, avec des ponts aux carrefours
const RIVER_J = 9, RZ0 = -HALF + ROAD + 9 * STEP + WALK, RZ1 = -HALF + ROAD + 9 * STEP + BLOCK - WALK;
const inRiverBand = z => z > RZ0 && z < RZ1;
const onBridge = x => { const k = Math.round((x + HALF - ROAD / 2) / STEP); return k >= 0 && k <= NB && Math.abs(x - (-HALF + ROAD / 2 + k * STEP)) < ROAD / 2; };
const isWater = (x, z) => !onAirport(x, z) && !onHighway(x, z) && !onNorth(x, z) && (shoreE(x, z) > shoreEdge(x, z) - 4.5 || (inRiverBand(z) && !onBridge(x) && Math.abs(x) < SHORE + 40));
const BLOCK_BOXES = new Map(); // zones solides par pâté (par défaut : toute l'emprise bâtie)
// la montagne (clin d'œil au grand sommet) : une île au nord, reliée par une voie rapide sur pont
const MT = { x: 0, z: -2050, R: 520, peak: 255 };
// la campagne (« Les Terres ») : collines, champs, fermes, village, entre la ville et la montagne
const CS = { cx: -40, cz: -1065, rx: 720, rz: 505 };
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
// aéroport (plateforme gagnée sur la mer, au sud) et aérodrome taillé au pied de la montagne
const AP = { x0: -270, x1: 270, z0: 412, z1: 515, rz: 490 };
const onAirport = (x, z) => x > AP.x0 && x < AP.x1 && z > AP.z0 && z < AP.z1;
const PAD = { x0: 300, x1: 332, z0: -1330, z1: -1170, h: 2.2 };
function padMask(x, z) { const dx = Math.max(PAD.x0 - x, 0, x - PAD.x1), dz = Math.max(PAD.z0 - z, 0, z - PAD.z1); return 1 - sstep(0, 16, Math.hypot(dx, dz)); }
function mtnH(x, z) { const m = padMask(x, z), h = mtnH0(x, z); return m > 0 ? h * (1 - m) + PAD.h * m : h; }
function mtnH0(x, z) {
  const dx = x - MT.x, dz = z - MT.z, d = Math.hypot(dx, dz) / MT.R; if (d > 1.25) return -4;
  const a = Math.atan2(dz, dx), ridge = 1 + 0.16 * Math.sin(5 * a + 1) + 0.08 * Math.sin(11 * a + 2);
  const land = sstep(1.09, 0.96, d), core = Math.max(0, 1 - d * 1.05 / ridge);
  return -4 + land * 4.6 + MT.peak * Math.pow(core, 1.9) + core * (6 * Math.sin(x * 0.03) * Math.sin(z * 0.035) + 3 * Math.sin(x * 0.09 + z * 0.07));
}
function csMask(x, z) { const dx = (x - CS.cx) / CS.rx, dz = (z - CS.cz) / CS.rz, a = Math.atan2(dz, dx), d = Math.pow(dx ** 4 + dz ** 4, 0.25); return d / (1 + 0.06 * Math.sin(a * 5 + 1) + 0.035 * Math.sin(a * 11 + 0.4)); }
function csBase(x, z) { return Math.max(0.8, 2.6 + 3.4 * Math.sin(x * 0.0061 + 1) * Math.cos(z * 0.0049) + 2.6 * Math.sin((x - z) * 0.0103) + 1.1 * Math.sin(x * 0.023 + z * 0.017)); }
// la nationale : de la sortie du pont jusqu'au pied de la montagne, en courbes
const NAT = (() => { const K = [[0, -640], [30, -720], [95, -830], [70, -950], [-30, -1040], [-110, -1150], [-95, -1290], [-20, -1400], [0, -1500]];
  const out = []; for (let i = 0; i < K.length - 1; i++) { const p0 = K[Math.max(0, i - 1)], p1 = K[i], p2 = K[i + 1], p3 = K[Math.min(K.length - 1, i + 2)];
    for (let k = 0; k < 40; k++) { const t = k / 40, t2 = t * t, t3 = t2 * t; out.push([0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3), 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); } }
  out.push(K[K.length - 1]); return out; })();
// petits chemins de terre vers les fermes
const PATHS = [[[95, -830], [220, -790], [330, -700], [420, -720]], [[-110, -1150], [-260, -1120], [-400, -1180], [-520, -1100]], [[70, -950], [200, -1010], [300, -1150], [316, -1250]], [[-30, -1040], [-180, -930], [-320, -880]]];
function nearPoly(P, x, z) { let best = 1e9, bi = 0; for (let i = 0; i < P.length - 1; i++) { const ax = P[i][0], az = P[i][1], bx = P[i + 1][0], bz = P[i + 1][1], vx = bx - ax, vz = bz - az, L = vx * vx + vz * vz || 1, t = Math.max(0, Math.min(1, ((x - ax) * vx + (z - az) * vz) / L)), dx = ax + vx * t - x, dz = az + vz * t - z, d = dx * dx + dz * dz; if (d < best) { best = d; bi = i + t; } } return [Math.sqrt(best), bi]; }
const nearNat = (x, z) => nearPoly(NAT, x, z)[0];
const nearPath = (x, z) => Math.min(...PATHS.map(P => nearPoly(P, x, z)[0]));
function csH0(x, z) {
  const m = csMask(x, z); if (m > 1.14) return -4;
  let h = csBase(x, z);
  const [dn, bi] = nearPoly(NAT, x, z); if (dn < 16) { const i = Math.min(NAT.length - 1, Math.floor(bi)), rh = csBase(NAT[i][0], NAT[i][1]); h += (rh - h) * (1 - sstep(7, 16, dn)); }
  const ek = sstep(0.93, 1.07, m); return h * (1 - ek) - 4 * ek;
}
function csH(x, z) { const m = padMask(x, z), h = csH0(x, z); return m > 0 ? h * (1 - m) + PAD.h * m : h; }
function landH(x, z) { return Math.max(mtnH(x, z), csH(x, z)); }
const onNorth = (x, z) => z < -470 && landH(x, z) > -0.3;
// voie rapide : de la ville (avenue centrale) jusqu'à la campagne, sur un pont au-dessus du chenal
const HW = { x: 0, z0: -HALF, z1: -640, deck: 9 };
